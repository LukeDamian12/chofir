<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sofirmolo // Panel de administración</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" data-url="https://srml.netlify.app"></script>
</head>
<body>
  <!-- Script principal de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Forzar redirección al panel de Netlify Identity si no hay sesión iniciada
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
      
      // Si hacen clic en cualquier parte del botón roto, redirigir al login oficial de Netlify
      document.addEventListener("click", function(e) {
        if (e.target && (e.target.matches('.netlify-identity-widget') || e.target.closest('button'))) {
          if (!window.netlifyIdentity.currentUser()) {
            e.preventDefault();
            window.location.href = "https://srml.netlify.app/#netlify-identity-menu=login";
          }
        }
      });
    }
  </script>
</body>
</html>

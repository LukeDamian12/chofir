backend:
  name: github
  repo: LukeDamian12/chofir
  branch: main
  base_url: https://sveltia-cms-auth.lucasblenckmann.workers.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - {label: "Miniatura", name: "thumbnail", widget: "image", required: false}
      - {label: "YouTube", name: "youtube", widget: "string", required: false}
      - {label: "BitChute", name: "bitchute", widget: "string", required: false}
      - {label: "Odysee", name: "odysee", widget: "string", required: false}
      - {label: "Link de descarga", name: "download", widget: "string", required: false}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Escribí un tag por línea. Cada tag puede contener varias palabras, por ejemplo: Historia de España"
      - {label: "Notas adicionales", name: "body", widget: "markdown", required: false}

  - name: "directos"
    label: "Directos"
    folder: "content/directos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - {label: "Miniatura", name: "thumbnail", widget: "image", required: false}
      - {label: "YouTube", name: "youtube", widget: "string", required: false}
      - {label: "BitChute", name: "bitchute", widget: "string", required: false}
      - {label: "Odysee", name: "odysee", widget: "string", required: false}
      - {label: "Link de descarga", name: "download", widget: "string", required: false}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Escribí un tag por línea. Cada tag puede contener varias palabras, por ejemplo: Historia de España"
      - {label: "Notas adicionales", name: "body", widget: "markdown", required: false}

  - name: "articulos"
    label: "Artículos"
    folder: "content/articulos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción / introducción", name: "description", widget: "text"}
      - {label: "Autor", name: "author", widget: "string", required: false}
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - {label: "Miniatura", name: "thumbnail", widget: "image", required: false}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Escribí un tag por línea. Cada tag puede contener varias palabras, por ejemplo: Historia de España"
      - {label: "Texto del artículo", name: "body", widget: "markdown"}

  - name: "recursos"
    label: "Recursos"
    folder: "content/recursos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Miniatura", name: "thumbnail", widget: "image", required: false}
      - {label: "Categoría", name: "categoria", widget: "string", required: false}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Escribí un tag por línea. Cada tag puede contener varias palabras, por ejemplo: Historia de España"
      - {label: "Link de descarga (PDF)", name: "archivo", widget: "string", required: false}
      - {label: "Link para leer online", name: "enlace", widget: "string", required: false}
      - {label: "Notas adicionales", name: "body", widget: "markdown", required: false}

  - name: "bitacora"
    label: "Bitácora"
    files:
      - name: "bitacora"
        label: "Lo más reciente"
        file: "_data/bitacora.json"
        fields:
          - label: "Entradas"
            name: "entradas"
            widget: "list"
            fields:
              - label: "Fecha"
                name: "fecha"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - {label: "Texto", name: "texto", widget: "string"}

      - name: "systemlog"
        label: "Log de sistema (frases)"
        file: "_data/systemlog.json"
        fields:
          - label: "Frases"
            name: "frases"
            widget: "list"
            field:
              label: "Frase"
              name: "texto"
              widget: "text"

  - name: "atlas_conocimiento"
    label: "Atlas / Dossiers"
    files:
      - name: "knowledge"
        label: "Mapa de conocimiento"
        file: "_data/knowledge.json"
        fields:
          - label: "Ajustes automáticos"
            name: "settings"
            widget: "object"
            fields:
              - {label: "Máx. conexiones automáticas por nodo", name: "max_auto_links_per_node", widget: "number", value_type: "int", min: 1, max: 8, default: 2}
              - {label: "Coincidencias para considerar conexión fuerte", name: "strong_link_min_shared", widget: "number", value_type: "int", min: 2, max: 20, default: 4}
              - {label: "Cantidad de nodos ancla", name: "anchor_count", widget: "number", value_type: "int", min: 3, max: 16, default: 8}
              - {label: "Zoom inicial", name: "default_zoom", widget: "number", value_type: "float", min: 0.2, max: 1.5, step: 0.05, default: 0.72}

          - label: "Fichas de nodos"
            name: "nodes"
            widget: "list"
            required: false
            summary: "{{fields.tag}} · {{fields.status}}"
            fields:
              - {label: "Tag exacto", name: "tag", widget: "string", hint: "Tiene que corresponder al tag del contenido. No crea ni modifica tags de tus publicaciones."}
              - {label: "Título visible", name: "title", widget: "string", required: false}
              - {label: "Es dossier editorial", name: "dossier", widget: "boolean", default: false}
              - {label: "Estado", name: "status", widget: "string", required: false}
              - {label: "Subtítulo", name: "subtitle", widget: "string", required: false}
              - {label: "Descripción", name: "description", widget: "text", required: false}
              - {label: "Información ampliada", name: "more_info", widget: "text", required: false}
              - {label: "Cita / frase", name: "quote", widget: "text", required: false}
              - {label: "Acento", name: "accent", widget: "select", options: ["blue", "red"], default: "blue"}
              - {label: "Prioridad visual (0-10)", name: "priority", widget: "number", value_type: "int", min: 0, max: 10, default: 0}
              - {label: "Posición X opcional", name: "x", widget: "number", required: false, hint: "Dejala vacía para posición automática estable."}
              - {label: "Posición Y opcional", name: "y", widget: "number", required: false, hint: "Dejala vacía para posición automática estable."}

          - label: "Relaciones manuales"
            name: "relations"
            widget: "list"
            required: false
            summary: "{{fields.from}} → {{fields.to}}"
            fields:
              - {label: "Nodo A / tag", name: "from", widget: "string"}
              - {label: "Nodo B / tag", name: "to", widget: "string"}
              - {label: "Texto de la relación", name: "label", widget: "string", required: false}
              - {label: "Fuerza visual (1-5)", name: "strength", widget: "number", value_type: "int", min: 1, max: 5, default: 3}
              - {label: "Direccional (A → B)", name: "directed", widget: "boolean", default: false}
              - {label: "Color", name: "accent", widget: "select", options: ["blue", "red"], default: "red"}

          - label: "Bloquear relaciones automáticas"
            name: "blocked_relations"
            widget: "list"
            required: false
            summary: "{{fields.from}} × {{fields.to}}"
            hint: "Usalo cuando dos tags coinciden en contenidos pero no querés que esa conexión aparezca automáticamente."
            fields:
              - {label: "Nodo A / tag", name: "from", widget: "string"}
              - {label: "Nodo B / tag", name: "to", widget: "string"}

  - name: "lofi_radio"
    label: "LOFI // Radio"
    files:
      - name: "lofi"
        label: "Playlist pública"
        file: "_data/lofi.json"
        fields:
          - {label: "Texto principal del cassette", name: "station_title", widget: "string", default: "SOFIRMOLO"}
          - {label: "Subtítulo del cassette", name: "station_subtitle", widget: "string", default: "LO-FI SESSION"}
          - {label: "Repetir playlist al terminar", name: "repeat_playlist", widget: "boolean", default: true}
          - label: "Pistas"
            name: "tracks"
            widget: "list"
            required: false
            summary: "{{fields.titulo}}"
            hint: "Subí MP3 propios. El orden de esta lista es el orden de reproducción pública."
            fields:
              - {label: "Título visible", name: "titulo", widget: "string"}
              - {label: "Archivo MP3", name: "archivo", widget: "file", hint: "Elegí o subí el MP3. Se guardará usando la biblioteca de medios del sitio."}
              - {label: "Activa", name: "activo", widget: "boolean", default: true, hint: "Desactivala para ocultar temporalmente la pista sin borrarla."}

